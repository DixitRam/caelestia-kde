name: Version Release

# One pipeline, three channels, and nothing published until the assets exist.
#
#   rehearsal  any ref, publishes a prerelease under `rehearsal-<sha>` - the simulated push
#   rc         the version as a prerelease under `rc-v<version>`, for looking at before promoting
#   stable     the push to main: `v<version>`, marked latest
#
# A tag is never a `v*` name unless the channel is stable: the shell's update checker walks
# local `refs/tags/v*`, so any other name would offer users an unreleased version.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: What to publish
        type: choice
        options: [rehearsal, rc, stable]
        default: rehearsal
      ref:
        description: Commit to build and publish
        type: string
        required: false
        default: dev
      tag:
        description: Override the tag the channel would derive
        type: string
        required: false
        default: ""
      publish:
        description: Publish; false builds and verifies only, with no tag or release
        type: boolean
        required: false
        default: false
      verify_packages:
        description: Also build the AUR package from the built tarballs
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      channel:
        description: What to publish
        type: string
        required: false
        default: rehearsal
      ref:
        description: Commit to build and publish; empty means the triggering SHA
        type: string
        required: false
        default: ""
      tag:
        description: Override the tag the channel would derive
        type: string
        required: false
        default: ""
      publish:
        description: Publish; false builds and verifies only
        type: boolean
        required: false
        default: false
      verify_packages:
        description: Also build the AUR package from the built tarballs
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ inputs.tag || inputs.channel || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assets:
    uses: ./.github/workflows/release-assets.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      tag: ${{ inputs.tag }}
      verify_packages: ${{ inputs.verify_packages || inputs.channel == 'rc' || inputs.channel == 'stable' || github.event_name == 'push' }}
  publish:
    needs: assets
    # A dispatch with publish=false is a rehearsal of the build graph and nothing else.
    if: inputs.publish || github.event_name == 'push'
    runs-on: ubuntu-latest
    # The gate: every asset exists and passed its checks before anything here can name a
    # release. Configure this environment with required reviewers.
    environment: release
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Collect the assets this run built
        uses: actions/download-artifact@v4
        with:
          # Named explicitly: the verify jobs in this run upload diagnostics too, and those
          # are not release assets.
          pattern: "{shell-artifacts,source-tarball,vendor-crates,installer-*}"
          path: assets
          merge-multiple: true

      - name: Create GitHub App Token
        id: app-token
        # A fork has no APP_CLIENT_ID; the tag and release still work on its own token.
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch main Branch
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force

      - name: Load Version from Config
        run: |
          set -euo pipefail
          source .github/version.env

          if [[ -z "${VERSION:-}" ]]; then
            echo "VERSION is missing in .github/version.env"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must match vX.Y.Z, got: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # The channel decides the tag name, and the tag name is what keeps a rehearsal
          # out of every `refs/tags/v*` walk in the tree.
          CHANNEL="${{ inputs.channel || 'stable' }}"
          case "$CHANNEL" in
            rehearsal) TAG="rehearsal-$(git rev-parse --short=12 HEAD)" ;;
            rc)        TAG="rc-$VERSION" ;;
            stable)    TAG="$VERSION" ;;
            *) echo "::error::unknown channel: $CHANNEL"; exit 1 ;;
          esac

          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          fi

          case "$TAG" in
            v[0-9]* | rc-v[0-9]* | rehearsal[-./]*) ;;
            *) echo "::error::refusing to publish under the tag '$TAG'"; exit 1 ;;
          esac

          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Validate Version Sync (Release-Only)
        run: |
          set -euo pipefail

          ABOUT_BINDING=$(grep -F 'text: CUtils.version ? `v${CUtils.version}` : "…"' shell/modules/nexus/pages/AboutPage.qml | head -n 1 || true)

          echo "Config VERSION: $VERSION"
          echo "About binding:  ${ABOUT_BINDING:-<missing>}"

          if [[ -z "${ABOUT_BINDING:-}" ]]; then
            echo "Version validation failed. Ensure AboutPage reads CUtils.version before release."
            exit 1
          fi

      - name: Create or Update the Tag
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)

          echo "LAST_TAG=$LAST_TAG" >> $GITHUB_ENV

          # A rehearsal tag names one rehearsal. Deleting it first is what lets a rerun move
          # it, and what keeps it from ever pointing at a second commit.
          if [[ "$CHANNEL" == "rehearsal" ]]; then
            git push origin "refs/tags/$TAG" --delete 2>/dev/null || true
          fi

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail

          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "$VERSION" ]; then
            git fetch origin dev:refs/remotes/origin/dev --force || true

            SYNC_COMMIT=$(git rev-list "$LAST_TAG..origin/dev" --ancestry-path --merges | tail -n 1 || true)

            if [ -n "$SYNC_COMMIT" ]; then
              git log "$SYNC_COMMIT..origin/dev" --no-merges --invert-grep --grep='\[skip ci\]' --pretty='- %s (%h)' > commit_notes.txt
            else
              git log "$LAST_TAG..$GITHUB_SHA" --no-merges --invert-grep --grep='\[skip ci\]' --pretty='- %s (%h)' > commit_notes.txt
            fi
          else
            git log origin/main -n 15 --no-merges --invert-grep --grep='\[skip ci\]' --pretty='- %s (%h)' > commit_notes.txt
          fi

          {
            echo "### What's New in $VERSION"
            echo

            if [ -s commit_notes.txt ]; then
              if grep -qiE '^- (major)(\([^)]*\))?:' commit_notes.txt; then
                echo "#### Major Changes"
                grep -iE '^- (major)(\([^)]*\))?:' commit_notes.txt | sed -E 's/^- (major)\(([^)]*)\): /- \2: /i; s/^- (major): /- /i'
                echo
              fi

              if grep -qiE '^- (feat|feature)(\([^)]*\))?:' commit_notes.txt; then
                echo "#### Features"
                grep -iE '^- (feat|feature)(\([^)]*\))?:' commit_notes.txt | sed -E 's/^- (feat|feature)\(([^)]*)\): /- \2: /i; s/^- (feat|feature): /- /i'
                echo
              fi

              if grep -qiE '^- (perf|performance)(\([^)]*\))?:' commit_notes.txt; then
                echo "#### Performance"
                grep -iE '^- (perf|performance)(\([^)]*\))?:' commit_notes.txt | sed -E 's/^- (perf|performance)\(([^)]*)\): /- \2: /i; s/^- (perf|performance): /- /i'
                echo
              fi

              if grep -qiE '^- (fix|bug)(\([^)]*\))?:' commit_notes.txt; then
                echo "#### Bug Fixes"
                grep -iE '^- (fix|bug)(\([^)]*\))?:' commit_notes.txt | sed -E 's/^- (fix|bug)\(([^)]*)\): /- \2: /i; s/^- (fix|bug): /- /i'
                echo
              fi
            else
              echo "- Maintenance release for $VERSION."
            fi
          } > release_notes.md

          # Draft first: the release only becomes visible once every asset this run built is
          # attached. That window used to be the whole build, and it was public.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Caelestia $TAG" \
              --notes-file release_notes.md \
              --draft
          else
            gh release create "$TAG" \
              --title "Caelestia $TAG" \
              --notes-file release_notes.md \
              --draft
          fi

      - name: Attach the Assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          ls -l assets
          gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Make the Release Visible
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            rehearsal | rc)
              # Published so the download URLs exist, but never `latest`, so nothing that
              # asks for the newest release can land on it.
              gh release edit "$TAG" --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
              ;;
            stable)
              gh release edit "$TAG" --draft=false --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
              # The candidate this release was promoted from has done its job.
              gh release delete "rc-$VERSION" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
              ;;
          esac

      - name: Open Sync PR to dev
        if: env.CHANNEL == 'stable' && github.repository == 'ladybug-me/caelestia-kde'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          echo "Attempting to open a PR to sync main into dev..."

          gh pr create \
            --base dev \
            --head main \
            --title "chore: sync main back to dev after $VERSION" \
            --body "This is an automated PR to sync the new release tags from \`main\` back into \`dev\`." || true