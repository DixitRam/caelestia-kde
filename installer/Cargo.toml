[package]
name = "caelestia-install"
version = "0.1.0"
edition = "2021"
# 1.75 is what the distribution toolchains on the supported targets ship, so a
# contributor can build the installer without rustup. The committed lockfile pins
# dependency versions that respect it; re-resolving may raise it.
rust-version = "1.75"
description = "The Caelestia installer TUI"
license = "MIT"
publish = false

# No JSON dependency: the theme, menu and step data are typed source.
[dependencies]
crossterm = "0.29.0"
libc = "0.2.190"
ratatui = "0.29.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
# panics unwind on purpose: the terminal is restored by a destructor, so
# aborting would leave the user's terminal in raw mode.
